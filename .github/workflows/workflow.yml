name: deploy-foundry
concurrency: deploy-foundry

on:
  push:
    branches:
      - main
    paths:
      - 'bicep/deploy/**'
      - 'bicep/modules/**'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read

env:
  AZURE_LOCATION: eastus2
  TEMPLATE: ./bicep/deploy/foundry.bicep
  PARAMETERS: ./bicep/deploy/foundry.parameters.bicepparam
  # Read by foundry.parameters.bicepparam via readEnvironmentVariable()
  SHUTDOWN_NOTIFICATION_EMAIL: ${{ secrets.SHUTDOWN_NOTIFICATION_EMAIL }}
  ACTION_GROUP_RESOURCE_ID: ${{ secrets.ACTION_GROUP_RESOURCE_ID }}

jobs:
  what-if:
    name: Bicep What-If
    runs-on: ubuntu-latest
    environment:
      name: what-if
    steps:
    - uses: actions/checkout@v5
    - uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Run What-If
      run: |
        az deployment sub what-if \
          --location "$AZURE_LOCATION" \
          --template-file "$TEMPLATE" \
          --parameters "$PARAMETERS" | tee whatif.txt
        {
          echo '## Bicep what-if'
          echo '```'
          cat whatif.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: what-if
    environment:
      name: prod ## approval gate to review what-if results before deploying
    steps:
    - uses: actions/checkout@v5
    - uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Deploy
      run: |
        az deployment sub create \
          --name "${{ github.run_number }}" \
          --location "$AZURE_LOCATION" \
          --template-file "$TEMPLATE" \
          --parameters "$PARAMETERS" \
          --query "{name:name, state:properties.provisioningState}" -o table
