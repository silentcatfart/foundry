---
- name: Helper scripts in the foundry home directory
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Create backup script
      ansible.builtin.template:
        src: backup.sh.j2
        dest: "{{ foundry_home }}/backup"
        owner: "{{ foundry_user }}"
        group: "{{ foundry_user }}"
        mode: "0755"

    - name: Create compendium-content-refresh script
      ansible.builtin.template:
        src: compendium-content-refresh.sh.j2
        dest: "{{ foundry_home }}/compendium-content-refresh"
        owner: "{{ foundry_user }}"
        group: "{{ foundry_user }}"
        mode: "0755"
      when: compendium_pull | bool and foundry_env != 'tst'

    - name: Create one-time compendium pull script (tst, new server installs only)
      ansible.builtin.template:
        src: compendium-content-refresh-one-time.sh.j2
        dest: "{{ foundry_home }}/compendium-content-refresh-one-time"
        owner: "{{ foundry_user }}"
        group: "{{ foundry_user }}"
        mode: "0755"
      when: foundry_env == 'tst'

    - name: Make sure tst has no automatic compendium-content-refresh script
      ansible.builtin.file:
        path: "{{ foundry_home }}/compendium-content-refresh"
        state: absent
      when: foundry_env == 'tst' or not compendium_pull | bool

    - name: Create release script (tst)
      ansible.builtin.template:
        src: release.sh.j2
        dest: "{{ foundry_home }}/release"
        owner: "{{ foundry_user }}"
        group: "{{ foundry_user }}"
        mode: "0755"
      when: foundry_env == 'tst'
