---
- name: Caddy reverse proxy
  hosts: all
  become: true
  gather_facts: true   # needed for ansible_default_ipv4

  tasks:
    - name: Create caddy config
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        mode: "0644"
        validate: caddy validate --adapter caddyfile --config %s
      no_log: true   # contains the GM basic_auth hash
      notify: Reload caddy

  handlers:
    - name: Reload caddy   # graceful, no dropped connections
      ansible.builtin.service:
        name: caddy
        state: reloaded
