---
- name: Cron jobs
  hosts: all
  become: true
  gather_facts: false

  tasks:
    # Must run before the Azure auto-shutdown (01:15 Eastern, see Bicep shutdownTime).
    # A VM that is already off at this time skips that night's backup.
    - name: Nightly backup to Azure Storage
      ansible.builtin.cron:
        name: "az-backup"
        minute: "50"
        hour: "0"
        job: "{{ foundry_home }}/backup >> {{ foundry_home }}/backup.log 2>&1"
        user: "{{ foundry_user }}"
        disabled: false

    - name: Nightly compendium download from Azure Storage
      ansible.builtin.cron:
        name: "az-dowload"   # existing cron entry name; renaming would leave a duplicate behind
        minute: "00"
        hour: "1"
        job: "{{ foundry_home }}/compendium-content-refresh"
        user: "{{ foundry_user }}"
        disabled: true
      when: compendium_pull | bool and foundry_env != 'tst'

    - name: Make sure tst has no compendium download job
      ansible.builtin.cron:
        name: "az-dowload"
        user: "{{ foundry_user }}"
        state: absent
      when: foundry_env == 'tst' or not compendium_pull | bool
