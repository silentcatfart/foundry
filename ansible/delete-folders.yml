---
- name: Remove the Foundry installation (keeps user data)
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Remove Foundry installation directory
      ansible.builtin.file:
        path: "{{ foundry_install_dir }}"
        state: absent

