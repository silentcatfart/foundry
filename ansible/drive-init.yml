---
- name: Partition, format and mount the data disk
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Create an xfs primary partition on the data disk (LUN 0)
      community.general.parted:
        device: "{{ data_disk_device }}"
        number: 1
        label: gpt
        name: xfspart
        state: present
        fs_type: xfs
        part_start: "0%"
        part_end: "100%"

    - name: Create an xfs filesystem on the data disk partition
      community.general.filesystem:
        fstype: xfs
        dev: "{{ data_disk_partition }}"

    - name: Get partition UUID
      ansible.builtin.command: lsblk -no UUID {{ data_disk_partition }}
      register: data_disk_uuid
      changed_when: false

    - name: Mount volume and create fstab entry
      ansible.posix.mount:
        path: "{{ data_disk_mount }}"
        src: "UUID={{ data_disk_uuid.stdout_lines[0] }}"
        state: mounted
        fstype: xfs
        opts: defaults,nofail
