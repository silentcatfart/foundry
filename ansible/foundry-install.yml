---
- name: Fresh Foundry install
  hosts: all
  become: false
  gather_facts: false

  tasks:
    - name: Download and unpack foundry
      ansible.builtin.include_tasks: tasks/download-foundry.yml

    - name: Register foundry with pm2
      ansible.builtin.command:
        cmd: pm2 start "node {{ foundry_install_dir }}/resources/app/main.js --dataPath={{ foundry_data_dir }}" --name foundry

    - name: Save pm2 process list
      ansible.builtin.command:
        cmd: pm2 save

    - name: Wait for foundry to build out the user data path
      ansible.builtin.include_tasks: tasks/wait-for-foundry.yml
