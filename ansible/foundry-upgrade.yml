---
- name: Upgrade Foundry in place
  hosts: all
  become: false
  gather_facts: false

  tasks:
    - name: Download and unpack foundry
      ansible.builtin.include_tasks: tasks/download-foundry.yml

    - name: Start foundry
      ansible.builtin.command:
        cmd: pm2 start foundry

    - name: Wait for foundry to come up
      ansible.builtin.include_tasks: tasks/wait-for-foundry.yml
