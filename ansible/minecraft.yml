---
- name: Minecraft server
  hosts: all
  become: true
  gather_facts: false

  vars:
    minecraft_dir: "{{ foundry_drive }}/minecraft"

  tasks:
    - name: Install java and screen
      ansible.builtin.apt:
        pkg:
          - openjdk-21-jre-headless
          - screen
        update_cache: true

    - name: Make minecraft directory
      ansible.builtin.file:
        path: "{{ minecraft_dir }}"
        state: directory
        owner: "{{ foundry_user }}"
        group: "{{ foundry_user }}"
        mode: "0755"

    - name: Download Minecraft
      ansible.builtin.get_url:
        url: "{{ minecraft_url }}"
        dest: "{{ minecraft_dir }}/minecraft_server.jar"
        owner: "{{ foundry_user }}"
        group: "{{ foundry_user }}"
        mode: "0644"

    - name: Bootstrap minecraft (max 60 seconds)
      ansible.builtin.command:
        chdir: "{{ minecraft_dir }}"
        cmd: timeout 60 java -Xmx1024M -Xms1024M -jar minecraft_server.jar nogui
        creates: "{{ minecraft_dir }}/eula.txt"
      become_user: "{{ foundry_user }}"
      ignore_errors: true

    - name: Agree to eula
      ansible.builtin.lineinfile:
        path: "{{ minecraft_dir }}/eula.txt"
        regexp: '^eula='
        line: 'eula=true'

    - name: Copy minecraft service config to server
      ansible.builtin.copy:
        content: |
          ## /etc/systemd/system/minecraft.service

          [Unit]
          Description=Minecraft Server
          After=network.target

          [Service]
          RemainAfterExit=yes
          WorkingDirectory={{ minecraft_dir }}
          User={{ foundry_user }}
          Group={{ foundry_user }}

          # Start Screen, Java, and Minecraft
          ExecStart=screen -s mc -d -m java -server -Xms1024M -Xmx1024M -jar minecraft_server.jar nogui

          # Tell Minecraft to gracefully stop.
          # Ending Minecraft will terminate Java
          # systemd will kill Screen after the 10-second delay. No explicit kill for Screen needed
          ExecStop=screen -p 0 -S mc -X eval 'stuff "say SERVER SHUTTING DOWN. Saving map..."\\015'
          ExecStop=screen -p 0 -S mc -X eval 'stuff "save-all"\\015'
          ExecStop=screen -p 0 -S mc -X eval 'stuff "stop"\\015'
          ExecStop=sleep 10

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/minecraft.service
        mode: "0644"
        force: false

    - name: Enable and start minecraft service
      ansible.builtin.systemd_service:
        name: minecraft.service
        daemon_reload: true
        enabled: true
        state: started

    - name: Create kill-minecraft and start-minecraft scripts
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          sudo systemctl {{ item.action }} minecraft-ngrok.service
          sudo systemctl {{ item.action }} minecraft.service
        dest: "{{ foundry_home }}/{{ item.name }}"
        owner: "{{ foundry_user }}"
        group: "{{ foundry_user }}"
        mode: "0755"
        force: false
      loop:
        - { name: kill-minecraft, action: stop }
        - { name: start-minecraft, action: start }
