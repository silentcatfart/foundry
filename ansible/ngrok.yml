---
- name: ngrok tunnel for the Minecraft server
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Download ngrok
      ansible.builtin.get_url:
        url: "{{ ngrok_url }}"
        dest: /tmp/ngrok-v3-stable-linux-amd64.tgz
        mode: "0644"

    - name: Unpack ngrok into /usr/local/bin
      ansible.builtin.unarchive:
        src: /tmp/ngrok-v3-stable-linux-amd64.tgz
        dest: /usr/local/bin
        remote_src: true

    - name: Remove ngrok download
      ansible.builtin.file:
        path: /tmp/ngrok-v3-stable-linux-amd64.tgz
        state: absent

    - name: Create ngrok config directory
      ansible.builtin.file:
        path: "{{ foundry_home }}/.config/ngrok"
        state: directory
        owner: "{{ foundry_user }}"
        group: "{{ foundry_user }}"
        mode: "0700"

    - name: Copy ngrok config to server
      ansible.builtin.copy:
        content: |
          version: "2"
          authtoken: {{ ngrok_authtoken }}
          tunnels:
            minecraft:
              addr: 25565
              proto: tcp
              remote_addr: {{ ngrok_remote_add }}
        dest: "{{ foundry_home }}/.config/ngrok/ngrok.yml"
        owner: "{{ foundry_user }}"
        group: "{{ foundry_user }}"
        mode: "0600"
        force: false
      no_log: true

    - name: Copy ngrok service config to server
      ansible.builtin.copy:
        content: |
          ## /etc/systemd/system/minecraft-ngrok.service
          [Unit]
          Description=ngrok tunnel
          After=network-online.target
          Wants=network-online.target systemd-networkd-wait-online.service

          [Service]
          ExecStart=/usr/local/bin/ngrok start --all --config {{ foundry_home }}/.config/ngrok/ngrok.yml
          ExecReload=/bin/kill -HUP $MAINPID
          KillMode=process
          IgnoreSIGPIPE=true
          Restart=always
          RestartSec=3
          Type=simple

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/minecraft-ngrok.service
        mode: "0644"
        force: false

    - name: Enable and start ngrok service
      ansible.builtin.systemd_service:
        name: minecraft-ngrok.service
        daemon_reload: true
        enabled: true
        state: started
