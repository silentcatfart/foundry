---
- name: Configure Foundry options.json for the Caddy proxy
  hosts: all
  become: false
  gather_facts: false

  vars:
    options_file: "{{ foundry_data_dir }}/Config/options.json"

  tasks:
    - name: Stop foundry
      ansible.builtin.command:
        cmd: pm2 stop foundry

    - name: Update options.json proxy port
      ansible.builtin.replace:
        path: "{{ options_file }}"
        regexp: '"proxyPort": null,'
        replace: '"proxyPort": 443,'

    - name: Update options.json SSL enable
      ansible.builtin.replace:
        path: "{{ options_file }}"
        regexp: '"proxySSL": false,'
        replace: '"proxySSL": true,'

    - name: Update options.json hostname
      ansible.builtin.replace:
        path: "{{ options_file }}"
        regexp: '"hostname": null,'
        replace: '"hostname": "{{ inventory_hostname }}",'

    - name: Start foundry
      ansible.builtin.command:
        cmd: pm2 start foundry
