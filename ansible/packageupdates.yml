---
- name: Patch servers
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Upgrade all apt packages (including new kernels)
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot server
      ansible.builtin.reboot:
      when: reboot_required.stat.exists
