---
- name: Install pm2 and register it with systemd
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Install pm2
      community.general.npm:
        name: pm2
        global: true
        state: latest

    - name: Register pm2 startup service for the foundry user
      ansible.builtin.command:
        cmd: /usr/lib/node_modules/pm2/bin/pm2 startup systemd -u {{ foundry_user }} --hp {{ foundry_home }}
        creates: /etc/systemd/system/pm2-{{ foundry_user }}.service
