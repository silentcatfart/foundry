---
- name: Package repositories and prerequisites
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        pkg:
          - ca-certificates
          - curl
          - gnupg
          - net-tools
          - python3-debian   # needed by deb822_repository
        update_cache: true

    # Older runs wrote one-line .list files; leaving them next to the deb822 sources
    # makes apt fail with conflicting Signed-By values.
    - name: Remove legacy repo files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/caddy-stable.list
        - /etc/apt/sources.list.d/nodesource.list

    - name: Add caddy repo
      ansible.builtin.deb822_repository:
        name: caddy-stable
        types: deb
        uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
        suites: any-version
        components: main
        signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key

    - name: Add node {{ node_major }} repo
      ansible.builtin.deb822_repository:
        name: nodesource
        types: deb
        uris: https://deb.nodesource.com/node_{{ node_major }}.x
        suites: nodistro
        components: main
        signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key

    - name: Install caddy and tools
      ansible.builtin.apt:
        pkg:
          - libnss3-tools
          - caddy
          - unzip
        state: present
        update_cache: true

    - name: Upgrade nodejs (includes npm)
      ansible.builtin.apt:
        pkg:
          - nodejs
        state: latest
