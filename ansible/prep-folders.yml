---
- name: Foundry folders on the data disk
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Make foundry directory on the data disk
      ansible.builtin.file:
        path: "{{ data_disk_mount }}/foundryvtt"
        state: directory
        owner: "{{ foundry_user }}"
        group: "{{ foundry_user }}"
        mode: "0755"

    - name: Link it into the foundry home directory
      ansible.builtin.file:
        src: "{{ data_disk_mount }}/foundryvtt"
        dest: "{{ foundry_drive }}"
        state: link
        owner: "{{ foundry_user }}"
        group: "{{ foundry_user }}"
