---
- name: Foundry folders on the data disk
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Make foundry directory on the data disk
      ansible.builtin.file:
        path: "{{ data_disk_mount }}/foundryvtt"
        state: directory
        owner: "{{ foundry_user }}"
        group: "{{ foundry_user }}"
        mode: "0755"

    - name: Link it into the foundry home directory
      ansible.builtin.file:
        src: "{{ data_disk_mount }}/foundryvtt"
        dest: "{{ foundry_drive }}"
        state: link
        owner: "{{ foundry_user }}"
        group: "{{ foundry_user }}"

    # The blob sync runs as the foundry user, so it can't update or delete anything
    # root owns here (a root rclone run on dev once left GM PDFs it couldn't remove).
    - name: Make sure the foundry user owns the artifacts folder
      ansible.builtin.file:
        path: "{{ foundry_artifacts_dir }}"
        state: directory
        recurse: true
        owner: "{{ foundry_user }}"
        group: "{{ foundry_user }}"
