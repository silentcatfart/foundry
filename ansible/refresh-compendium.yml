---
- name: Pull compendium artifacts from blob storage at boot
  hosts: all
  become: true
  gather_facts: false

  tasks:
    # Same check as prep-folders.yml: the sync runs as the foundry user and fails on
    # anything root owns, which once left GM PDFs on dev that should have been removed.
    - name: Make sure the foundry user owns the artifacts folder
      ansible.builtin.file:
        path: "{{ foundry_artifacts_dir }}"
        state: directory
        recurse: true
        owner: "{{ foundry_user }}"
        group: "{{ foundry_user }}"

    - name: Create rclone-az-compendium-to-local.service
      ansible.builtin.template:
        src: rclone-az-compendium-to-local.service.j2
        dest: /etc/systemd/system/rclone-az-compendium-to-local.service
        mode: "0644"
      when: compendium_pull | bool and foundry_env != 'tst'

    - name: Enable the service and run a sync now
      ansible.builtin.systemd_service:
        name: rclone-az-compendium-to-local.service
        daemon_reload: true
        enabled: true
        state: restarted
        no_block: true   # oneshot: don't wait for the full sync to finish
      when: compendium_pull | bool and foundry_env != 'tst'

    # tst must never pull artifacts automatically. These are no-ops unless something slipped through.
    - name: Make sure the pull service is not enabled on tst
      ansible.builtin.systemd_service:
        name: rclone-az-compendium-to-local.service
        enabled: false
      failed_when: false
      when: foundry_env == 'tst' or not compendium_pull | bool

    - name: Make sure the pull service unit does not exist on tst
      ansible.builtin.file:
        path: /etc/systemd/system/rclone-az-compendium-to-local.service
        state: absent
      when: foundry_env == 'tst' or not compendium_pull | bool
