---
# foundry ALL=(ALL) NOPASSWD:ALL in /etc/sudoers.d/
- name: Passwordless sudo for the foundry user
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Allow foundry user to run all commands without password
      community.general.sudoers:
        name: foundry-all
        state: present
        user: "{{ foundry_user }}"
        runas: ALL
        commands: ALL
        nopassword: true
